[package]
name = "plrust-tests"
version = "1.2.8"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg17"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13" ]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14" ]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg_test = []
trusted = []

[dependencies]
pgrx = "=0.12.8"
tempfile = "3.8.1"
once_cell = "1.18.0"

[dev-dependencies]
pgrx-tests = "=0.12.8"
tempfile = "3.8.1"
once_cell = "1.18.0"
